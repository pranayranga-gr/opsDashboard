<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ops Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #f5f7fb;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .gate {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(120deg, rgba(28, 36, 58, 0.08), rgba(47, 111, 237, 0.08)),
        #f5f7fb;
    }

    .gate[hidden] {
      display: none;
    }

    .gate-panel {
      width: min(100%, 420px);
      padding: 28px;
      border: 1px solid #dce3f0;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 18px 48px rgba(23, 32, 51, 0.12);
    }

    .gate-panel h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .gate-panel p {
      margin: 0 0 20px;
      color: #5c6780;
      font-size: 14px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      color: #34405a;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 1px solid #c7d1e3;
      border-radius: 6px;
      color: #172033;
      font: inherit;
    }

    input:focus {
      border-color: #2f6fed;
      outline: 3px solid rgba(47, 111, 237, 0.18);
    }

    button {
      width: 100%;
      height: 44px;
      margin-top: 18px;
      border: 0;
      border-radius: 6px;
      background: #1f5fd1;
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #174fb0;
    }

    .error {
      min-height: 18px;
      margin-top: 12px;
      color: #b42318;
      font-size: 13px;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <main class="gate" id="accessGate">
    <form class="gate-panel" id="accessForm">
      <h1>Ops Dashboard Prototype</h1>
      <p>Enter your reviewer name and access code to open the wireframe.</p>

      <label for="reviewerName">Reviewer name</label>
      <input id="reviewerName" name="reviewerName" autocomplete="name" required>

      <label for="accessCode">Access code</label>
      <input id="accessCode" name="accessCode" type="password" autocomplete="off" required>

      <button type="submit">Open prototype</button>
      <div class="error" id="accessError" role="alert"></div>
    </form>
  </main>

  <iframe
    id="prototypeFrame"
    title="Concept Prototype Ops Dashboard"
    allowfullscreen
  ></iframe>

  <script>
    const prototypeUrl = "Concept%20Prototype%20Ops%20Dashboard.html";
    const accessCodes = new Map([
      ["ops-review-2026", "Client reviewer"],
      ["product-demo-2026", "Product stakeholder"]
    ]);

    const gate = document.getElementById("accessGate");
    const form = document.getElementById("accessForm");
    const error = document.getElementById("accessError");
    const frame = document.getElementById("prototypeFrame");

    function openPrototype(reviewerName, reviewerGroup) {
      const reviewerId = reviewerName.trim();
      sessionStorage.setItem("opsDashboardReviewer", reviewerId);
      sessionStorage.setItem("opsDashboardReviewerGroup", reviewerGroup);

      if (typeof window.clarity === "function") {
        window.clarity("identify", reviewerId);
      }

      frame.src = prototypeUrl;
      gate.hidden = true;
    }

    const savedReviewer = sessionStorage.getItem("opsDashboardReviewer");
    const savedReviewerGroup = sessionStorage.getItem("opsDashboardReviewerGroup");

    if (savedReviewer && savedReviewerGroup) {
      openPrototype(savedReviewer, savedReviewerGroup);
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const formData = new FormData(form);
      const reviewerName = String(formData.get("reviewerName") || "").trim();
      const accessCode = String(formData.get("accessCode") || "").trim();
      const reviewerGroup = accessCodes.get(accessCode);

      if (!reviewerName || !reviewerGroup) {
        error.textContent = "Please enter the reviewer name and a valid access code.";
        return;
      }

      error.textContent = "";
      openPrototype(reviewerName, reviewerGroup);
    });
  </script>
</body>
</html>
